name: Release macOS updater lab
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New increasing version. Never reuse a version.'
        required: true
        default: '1.0.1'
permissions:
  contents: read
concurrency:
  group: updater-releases
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and public repository
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PUBLIC
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          export LATEST
          python3 - <<'PY'
          import os
          parse = lambda v: tuple(map(int, v.removeprefix('v').split('.')))
          assert parse(os.environ['VERSION']) > parse(os.environ['LATEST']), 'Version must increase'
          PY
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Version already exists. Choose a new version.'; exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: dotnet tool install -g vpk --version 1.2.0
      - name: Build Flutter release
        run: flutter build macos --release --build-name="$VERSION" --dart-define=APP_VERSION="$VERSION"
      - name: Fetch previous full package for delta generation
        run: vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --channel osx-arm64
      - name: Package unsigned laboratory build
        run: vpk pack --packId UpdaterLab --packVersion "$VERSION" --packDir build/macos/Build/Products/Release/updater_lab.app --mainExe updater_lab --channel osx-arm64 --runtime osx-arm64
      - name: Verify release payload
        run: |
          test -s "Releases/UpdaterLab-$VERSION-osx-arm64-full.nupkg"
          test -s "Releases/UpdaterLab-$VERSION-osx-arm64-delta.nupkg"
          test -s Releases/UpdaterLab-osx-arm64-Setup.pkg
          test -s Releases/releases.osx-arm64.json
          unzip -l "Releases/UpdaterLab-$VERSION-osx-arm64-full.nupkg" | grep UpdateMac
          shasum -a 256 Releases/* > SHA256SUMS.txt
          mv SHA256SUMS.txt Releases/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ inputs.version }}
          path: Releases/*
          retention-days: 3
          if-no-files-found: error
      - name: Upload complete draft then publish
        run: |
          set -euo pipefail
          gh release create "v$VERSION" Releases/* --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Updater Lab $VERSION (macOS Apple Silicon)" --notes-file RELEASE_NOTES.md
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
